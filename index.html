<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="author" content="Rachit Ranade">
<title>rPPG</title>
<style>
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; background:#000; color:#fff; overflow:hidden;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
  button { font:inherit; color:inherit; }

  /* landing */
  #landing { position:fixed; inset:0; background:#f4f4f1; display:flex; align-items:center; justify-content:center;
    transition:opacity .7s ease, visibility .7s; z-index:10; }
  #landing.gone { opacity:0; visibility:hidden; pointer-events:none; }
  #unlock { all:unset; cursor:pointer; color:#0b0b0b; font:200 clamp(56px,11vw,170px)/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    letter-spacing:-.03em; transition:letter-spacing .6s cubic-bezier(.2,.8,.2,1), transform .2s, opacity .3s;
    animation:rise 1s cubic-bezier(.2,.8,.2,1) both; }
  #unlock:hover { letter-spacing:.03em; }
  #unlock:active { transform:scale(.97); opacity:.7; }

  /* keypad */
  #pad { position:fixed; inset:0; background:#000; z-index:20; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:56px; opacity:0; visibility:hidden; transition:opacity .45s ease, visibility .45s; }
  #pad.on { opacity:1; visibility:visible; }
  #dots { display:flex; gap:22px; }
  .dot { width:14px; height:14px; border-radius:50%; border:1px solid #666; transition:background .2s, border-color .2s, box-shadow .3s; }
  .dot.f { background:#fff; border-color:#fff; box-shadow:0 0 18px #ffffff66; }
  #dots.bad .dot { background:#ff4d5e; border-color:#ff4d5e; box-shadow:0 0 18px #ff4d5e88; }
  #dots.bad { animation:shake .42s; }
  #dots.ok .dot { background:#fff; border-color:#fff; box-shadow:0 0 28px #fff; }
  #keys { display:grid; grid-template-columns:repeat(3,78px); gap:18px; }
  .k { width:78px; height:78px; border-radius:50%; border:1px solid #2a2a2a; background:none; cursor:pointer;
    font:200 30px ui-sans-serif,system-ui,sans-serif; transition:transform .12s, background .25s, border-color .25s; }
  .k:hover { background:#101010; border-color:#555; }
  .k:active { transform:scale(.91); background:#1c1c1c; }

  /* app */
  #app { position:fixed; inset:0; display:grid; grid-template-rows:minmax(0,1fr) auto 44px; opacity:0; visibility:hidden;
    transition:opacity .9s ease .1s, visibility .9s; }
  #app.on { opacity:1; visibility:visible; }
  main { display:grid; grid-template-columns:auto minmax(0,1fr); gap:32px; padding:36px 44px 8px; min-height:0; }
  .left { position:relative; min-height:0; height:100%; }
  #face { height:100%; aspect-ratio:6/7; border-radius:20px; background:#0a0a0a; display:block; }
  #msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#555; font-size:13px; letter-spacing:.12em; }
  .right { display:grid; grid-template-rows:minmax(0,1fr) 120px; gap:16px; min-height:0; }
  #tl, #hist { width:100%; height:100%; display:block; min-height:0; }
  #hr { position:relative; display:flex; align-items:baseline; justify-content:center; gap:16px; padding:6px 0 14px; }
  #bpm { font-size:clamp(72px,14vh,160px); font-weight:200; line-height:1; font-variant-numeric:tabular-nums;
    color:#fff; transition:color .6s ease, opacity .6s ease; }
  #bpm.beat { animation:beat .3s ease-out; }
  #hr.low #bpm { color:#363636; animation:none; }
  #pm { font-size:20px; font-weight:300; color:#666; min-width:48px; transition:color .6s, opacity .6s; }
  #hr.hide #bpm, #hr.hide #pm { opacity:0; }
  #hr.low #pm { color:#333; }
  #qbar { position:absolute; bottom:0; left:50%; height:1px; width:0; transform:translateX(-50%); background:#ff4d5e;
    transition:width .7s ease, background .7s ease; }
  #app.on main > * { animation:rise .9s cubic-bezier(.2,.8,.2,1) both; }
  #app.on main > .right { animation-delay:.12s; }
  #app.on #hr { animation:rise .9s cubic-bezier(.2,.8,.2,1) .25s both; }

  #by { position:fixed; left:0; right:0; bottom:0; height:44px; display:flex; align-items:center; justify-content:center;
    font-size:12px; letter-spacing:.16em; color:#555; z-index:15; transition:color .6s, opacity .4s; pointer-events:none; }
  #byt { pointer-events:auto; cursor:pointer; transition:color .3s; padding:8px 14px; }
  #byt:hover { color:#bbb; }
  body.light #by { color:#9a9a96; }
  body.light #byt:hover { color:#111; }
  body.padon #by { opacity:0; }
  video { position:fixed; right:0; bottom:0; width:2px; height:2px; opacity:.01; pointer-events:none; }
  .block { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; color:#777; letter-spacing:.14em; font-size:14px; }

  @keyframes rise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
  @keyframes shake { 0%,100% { transform:none; } 20% { transform:translateX(-12px); } 40% { transform:translateX(10px); }
    60% { transform:translateX(-7px); } 80% { transform:translateX(4px); } }
  @keyframes beat { 0% { transform:scale(1); } 30% { transform:scale(1.035); } 100% { transform:scale(1); } }
</style>
</head>
<body class="light">
<div id="landing"><button id="unlock">/unlock?</button></div>
<div id="pad"><div id="dots"><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></div><div id="keys"></div></div>
<div id="app">
  <main>
    <div class="left"><canvas id="face" width="480" height="560"></canvas><div id="msg"></div></div>
    <div class="right"><canvas id="tl"></canvas><canvas id="hist"></canvas></div>
  </main>
  <div id="hr" class="low"><div id="bpm">--</div><div id="pm"></div><i id="qbar"></i></div>
  <div></div>
</div>
<video id="video" playsinline muted></video>
<footer id="by"><span id="byt">made by Rachit Ranade</span></footer>

<script>
(function () {
'use strict';
const $ = id => document.getElementById(id);
if (matchMedia('(pointer: coarse)').matches || innerWidth < 800) {
  document.body.innerHTML = '<div class="block">desktop only</div>'; return;
}

/* ---------- Signal engine ---------- */
const MIN_Q = 0.35;   // below this signal quality the heart rate is greyed out

// Zero-phase band-pass (two Butterworth-style biquads, run forward and backward)
function biquad(type, f0, fs) {
  const w = 2 * Math.PI * f0 / fs, c = Math.cos(w), al = Math.sin(w) / (2 * Math.SQRT1_2);
  const b0 = type === 'lp' ? (1 - c) / 2 : (1 + c) / 2, b1 = type === 'lp' ? 1 - c : -(1 + c), a0 = 1 + al;
  return [b0 / a0, b1 / a0, b0 / a0, -2 * c / a0, (1 - al) / a0];
}
function runBiquad(k, x) {
  const [b0, b1, b2, a1, a2] = k, y = new Float64Array(x.length); let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
  for (let i = 0; i < x.length; i++) {
    const v = b0 * x[i] + b1 * x1 + b2 * x2 - a1 * y1 - a2 * y2;
    y[i] = v; x2 = x1; x1 = x[i]; y2 = y1; y1 = v;
  }
  return y;
}
function filtfilt(k, x) {
  const n = x.length, P = Math.min(n - 1, 90), z = new Float64Array(n + 2 * P);
  for (let i = 0; i < P; i++) { z[i] = 2 * x[0] - x[P - i]; z[n + P + i] = 2 * x[n - 1] - x[n - 2 - i]; }
  z.set(x, P);
  let y = runBiquad(k, z); y.reverse(); y = runBiquad(k, y); y.reverse();
  return y.slice(P, P + n);
}
function bandpass(x, fs, lo = 0.6, hi = 3.3) {
  let m = 0; for (const v of x) m += v; m /= x.length;
  const y = filtfilt(biquad('hp', lo, fs), Float64Array.from(x, v => v - m));
  return filtfilt(biquad('lp', hi, fs), y);
}

class Engine {
  constructor(win = 15, min = 8) { this.win = win; this.min = min; this.reset(); }
  reset() { this.t = []; this.r = []; this.g = []; this.b = []; this.sm = 0; }
  add(ts, r, g, b) {
    this.t.push(ts); this.r.push(r); this.g.push(g); this.b.push(b);
    while (this.t.length > 1 && ts - this.t[0] > this.win) {
      this.t.shift(); this.r.shift(); this.g.shift(); this.b.shift();
    }
  }
  resample(v, n, fs) {
    const out = new Float64Array(n), t0 = this.t[0], T = this.t; let j = 0;
    for (let i = 0; i < n; i++) {
      const tt = t0 + i / fs;
      while (j < T.length - 2 && T[j + 1] < tt) j++;
      const f = Math.min(1, Math.max(0, (tt - T[j]) / (T[j + 1] - T[j])));
      out[i] = v[j] + f * (v[j + 1] - v[j]);
    }
    return out;
  }
  std(a) { const m = a.reduce((x, y) => x + y, 0) / a.length; return Math.sqrt(a.reduce((s, v) => s + (v - m) ** 2, 0) / a.length); }
  pos(R, G, B, fs) {            // Wang et al. 2017, Plane-Orthogonal-to-Skin
    const n = R.length, L = Math.floor(1.6 * fs), h = new Float64Array(n);
    for (let s = 0; s <= n - L; s++) {
      let mr = 0, mg = 0, mb = 0;
      for (let i = s; i < s + L; i++) { mr += R[i]; mg += G[i]; mb += B[i]; }
      mr /= L; mg /= L; mb /= L;
      const s1 = new Float64Array(L), s2 = new Float64Array(L);
      for (let i = 0; i < L; i++) {
        const rn = R[s + i] / mr, gn = G[s + i] / mg, bn = B[s + i] / mb;
        s1[i] = gn - bn; s2[i] = gn + bn - 2 * rn;
      }
      const al = this.std(s1) / (this.std(s2) + 1e-9);
      const seg = s1.map((v, i) => v + al * s2[i]);
      const m = seg.reduce((x, y) => x + y, 0) / L;
      for (let i = 0; i < L; i++) h[s + i] += seg[i] - m;
    }
    return h;
  }
  spectrum(pulse, fs) {
    const n = pulse.length, step = 0.01, f0 = 0.7, K = Math.round((3.0 - f0) / step) + 1;
    const w = pulse.map((v, i) => v * (0.5 - 0.5 * Math.cos(2 * Math.PI * i / (n - 1))));
    const freqs = Array.from({ length: K }, (_, k) => f0 + k * step);
    const power = freqs.map(f => {
      let re = 0, im = 0; const om = 2 * Math.PI * f / fs;
      for (let i = 0; i < n; i++) { re += w[i] * Math.cos(om * i); im += w[i] * Math.sin(om * i); }
      return re * re + im * im;
    });
    let pk = 0; power.forEach((p, k) => { if (p > power[pk]) pk = k; });
    if (freqs[pk] / 2 >= 0.9) {   // a peak at half the frequency that is nearly as strong means the main peak is a harmonic
      const kh = Math.round((freqs[pk] / 2 - f0) / step); let best = kh;
      for (let k = Math.max(0, kh - 5); k <= Math.min(K - 1, kh + 5); k++) if (power[k] > power[best]) best = k;
      if (power[best] > 0.6 * power[pk]) pk = best;
    }
    let f = freqs[pk];
    if (pk > 0 && pk < K - 1) {   // parabolic refinement of the peak
      const a = power[pk - 1], b = power[pk], c = power[pk + 1], d = a - 2 * b + c;
      if (d < 0) f += 0.5 * (a - c) / d * step;
    }
    let tot = 0, sig = 0;
    for (let k = 0; k < K; k++) { tot += power[k]; if (Math.abs(freqs[k] - f) <= 0.1) sig += power[k]; }
    return { bpm: f * 60, quality: tot > 0 ? Math.min(1, sig / tot) : 0 };   // pure noise scores ~25%
  }
  pulseData() {     // band-passed pulse signal for the current window
    if (this.t.length < 2 || this.t.at(-1) - this.t[0] < this.min) return null;
    const fs = 30, n = Math.floor((this.t.at(-1) - this.t[0]) * fs);
    const R = this.resample(this.r, n, fs), G = this.resample(this.g, n, fs), B = this.resample(this.b, n, fs);
    return { pulse: bandpass(this.pos(R, G, B, fs), fs), t0: this.t[0], fs };
  }
  estimate() {
    const pd = this.pulseData(); if (!pd) return null;
    const fs = pd.fs, pulse = pd.pulse, n = pulse.length, sp = this.spectrum(pulse, fs);
    if (sp.quality >= MIN_Q) {   // displayed value moves at most 3 BPM per second
      if (this.sm === 0) this.sm = sp.bpm;
      else { const d = sp.bpm - this.sm; if (Math.abs(d) < 30 || sp.quality > 0.6) this.sm += Math.max(-3, Math.min(3, d * 0.4)); }
    }
    // spectral resolution of the window (60/T BPM) shrinks with signal-to-noise; plus a 2 BPM real-world floor
    const T = n / fs, snr = sp.quality / Math.max(1 - sp.quality, 0.02);
    const sigma = Math.sqrt(((60 / T) / Math.sqrt(Math.max(snr, 0.25))) ** 2 + 4);
    return { bpm: this.sm > 0 ? this.sm : sp.bpm, raw: sp.bpm, quality: sp.quality, sigma, pulse, t0: pd.t0 };
  }
}

// Heartbeats = peaks of the band-passed pulse. The first 0.6 s and last 0.5 s of a window are skipped (filter edge effects).
function detectBeats(pd, bpm) {
  const { pulse: p, t0, fs } = pd, tEnd = t0 + (p.length - 1) / fs; let mx = 0;
  for (const v of p) mx = Math.max(mx, Math.abs(v));
  const lo = t0 + 0.6, hi = tEnd - 0.5, gap = Math.max(0.3, 0.65 * 60 / bpm), found = [];
  if (!mx) return { found, lo, hi, mx: 1 };
  for (let i = 2; i < p.length - 2; i++) {
    const t = t0 + i / fs; if (t < lo || t > hi) continue;
    if (p[i] > p[i - 1] && p[i] >= p[i + 1] && p[i] > 0.3 * mx) {
      const prev = found[found.length - 1];
      if (prev && t - prev.t < gap) { if (p[i] / mx > prev.a) found[found.length - 1] = { t, a: p[i] / mx }; }
      else found.push({ t, a: p[i] / mx });
    }
  }
  return { found, lo, hi, mx };
}

/* ---------- Sound (all synthesised) ---------- */
const Snd = (() => {
  let ctx = null, muted = false;
  const ensure = () => {
    if (!ctx) { const A = window.AudioContext || window.webkitAudioContext; if (A) ctx = new A(); }
    if (ctx && ctx.state === 'suspended') ctx.resume();
  };
  addEventListener('pointerdown', ensure); addEventListener('keydown', ensure);
  function tone(f, d, type, v, at, f2) {
    if (!ctx || muted || ctx.state !== 'running') return;
    const t = ctx.currentTime + (at || 0), o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.012); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + d + 0.03);
  }
  return {
    toggle() { muted = !muted; },
    open() { tone(180, 0.45, 'sine', 0.07, 0, 55); },
    key(n) { tone(430 + n * 38, 0.09, 'sine', 0.06); },
    back() { tone(300, 0.07, 'sine', 0.05); },
    bad() { tone(150, 0.18, 'sawtooth', 0.04); tone(118, 0.24, 'sawtooth', 0.04, 0.16); },
    ok() { tone(523, 0.55, 'sine', 0.07); tone(659, 0.55, 'sine', 0.07, 0.13); tone(784, 0.8, 'sine', 0.07, 0.26); },
    beat() { tone(82, 0.15, 'sine', 0.13, 0, 46); tone(64, 0.13, 'sine', 0.07, 0.17, 40); },
    lock() { tone(660, 0.25, 'sine', 0.035); tone(990, 0.4, 'sine', 0.035, 0.1); },
  };
})();

/* ---------- Unlock flow ---------- */
const PASS = '5173';   // note: a static page can only gate, not truly protect
const isUnlocked = () => { try { return /(?:^|; )unlocked=1/.test(document.cookie) || localStorage.getItem('unlocked') === '1'; } catch (e) { return false; } };
const remember = () => {
  document.cookie = 'unlocked=1; max-age=315360000; path=/; SameSite=Lax' + (location.protocol === 'https:' ? '; Secure' : '');
  try { localStorage.setItem('unlocked', '1'); } catch (e) {}
};
let entry = '', busy = false;
const dots = [...document.querySelectorAll('.dot')];
function paintDots() { dots.forEach((d, i) => d.classList.toggle('f', i < entry.length)); }
function openPad() {
  entry = ''; busy = false; paintDots(); $('dots').className = '';
  Snd.open(); document.body.classList.add('padon'); $('pad').classList.add('on');
}
function closePad() { document.body.classList.remove('padon'); $('pad').classList.remove('on'); }
function press(k) {
  if (busy) return;
  if (k === '⌫') { entry = entry.slice(0, -1); Snd.back(); }
  else if (/^\d$/.test(k) && entry.length < 4) { entry += k; Snd.key(+k); }
  paintDots();
  if (entry.length === 4) {
    busy = true;
    setTimeout(() => {
      if (entry === PASS) { $('dots').className = 'ok'; Snd.ok(); remember(); setTimeout(showApp, 750); }
      else { $('dots').className = 'bad'; Snd.bad(); setTimeout(() => { entry = ''; paintDots(); $('dots').className = ''; busy = false; }, 600); }
    }, 160);
  }
}
['1','2','3','4','5','6','7','8','9','','0','⌫'].forEach(k => {
  const b = document.createElement('button'); b.className = 'k'; b.textContent = k;
  if (!k) b.style.visibility = 'hidden'; else b.onclick = () => press(k);
  $('keys').appendChild(b);
});
$('unlock').onclick = openPad;
$('byt').onclick = () => {      // clicking the credit forgets this device and returns to /unlock?
  try {
    document.cookie = 'unlocked=; max-age=0; path=/; SameSite=Lax' + (location.protocol === 'https:' ? '; Secure' : '');
    localStorage.removeItem('unlocked');
  } catch (e) {}
  Snd.back(); document.body.style.transition = 'opacity .45s'; document.body.style.opacity = '0';
  setTimeout(() => location.reload(), 480);
};
function showApp() {
  document.body.classList.remove('light', 'padon'); $('pad').classList.remove('on');
  $('landing').classList.add('gone'); $('app').classList.add('on');
  layoutFace(); startCamera();
}

/* ---------- Measurement ---------- */
const video = $('video'), work = document.createElement('canvas'), wctx = work.getContext('2d', { willReadFrequently: true });
const engine = new Engine();
const bins = [new Float32Array(64), new Float32Array(64), new Float32Array(64)];   // R,G,B histograms of the measured skin
const sbins = [new Float32Array(64), new Float32Array(64), new Float32Array(64)];
let stream = null, track = null, running = false, gen = 0, detector = null, loadingDet = null;
let lastDet = 0, detEvery = 500, target = null, cur = null, noFaceSince = null, lostReset = false;
let frame = 0, lastTs = 0, lastUi = 0, lastPulse = 0, useCap = null, prevLum = null, flagUntil = 0, mv = [];
let clk = null, beatsT = [], tlPulse = null, tlMx = 1, flashAt = -1e9, wasOk = false, hrHidden = false, curOk = false, curBpm = 60;
const beat = { on: false, at: 0, per: 800 }, rows = [], rawRows = [];
const TL_WIN = 20;   // seconds shown on the beat timeline
const renderT = nowMs => clk.ts + (nowMs - clk.wall) / 1000;   // stream time "now", for smooth scrolling

async function loadDetector() {
  if (detector || loadingDet) return loadingDet;
  loadingDet = (async () => {
    try {
      const base = 'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
      const m = await import(`${base}/vision_bundle.mjs`);
      const fs = await m.FilesetResolver.forVisionTasks(`${base}/wasm`);
      detector = await m.FaceDetector.createFromOptions(fs, {
        baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite' },
        runningMode: 'VIDEO' });
    } catch (e) { detector = null; console.warn('Face detector unavailable, using centre box', e); }
  })();
  return loadingDet;
}
function updateBox(now, ts, W, H) {
  if (detector && now - lastDet > detEvery) {          // detection is heavy: ~2x/s, backs off if slow
    lastDet = now;
    try {
      const t0 = performance.now(), dets = detector.detectForVideo(work, t0).detections;
      detEvery = Math.max(500, (performance.now() - t0) * 10);
      if (!dets.length) target = null;
      else {
        const bb = dets.map(d => d.boundingBox).sort((a, b) => b.width * b.height - a.width * a.height)[0];
        const nb = { x: bb.originX, y: bb.originY, w: bb.width, h: bb.height, det: true };
        if (cur && Math.abs(nb.x - cur.x) < 0.03 * cur.w && Math.abs(nb.y - cur.y) < 0.03 * cur.w && Math.abs(nb.w - cur.w) < 0.05 * cur.w) target = { ...cur };
        else target = nb;
      }
    } catch (e) { detector = null; }
  }
  if (!detector && !target) target = { x: W * 0.3, y: H * 0.2, w: W * 0.4, h: H * 0.6, det: false };
  if (target) {
    noFaceSince = null;
    if (!cur) cur = { ...target };
    else { for (const k of ['x', 'y', 'w', 'h']) cur[k] += (target[k] - cur[k]) * 0.15; cur.det = target.det; }
  } else {
    if (noFaceSince === null) noFaceSince = ts;
    if (ts - noFaceSince > 1.5) cur = null;
  }
}
function faceRois(b, W, H) {      // forehead + both cheeks
  const raw = [
    [b.x + b.w * 0.30, b.y + b.h * (b.det ? -0.12 : 0.02), b.w * 0.40, b.h * 0.16],
    [b.x + b.w * 0.12, b.y + b.h * 0.52, b.w * 0.24, b.h * 0.14],
    [b.x + b.w * 0.64, b.y + b.h * 0.52, b.w * 0.24, b.h * 0.14],
  ];
  return raw.map(r => {
    let [x, y, w, h] = r.map(Math.floor);
    x = Math.max(0, Math.min(x, W - 2)); y = Math.max(0, Math.min(y, H - 2));
    return [x, y, Math.max(2, Math.min(w, W - x)), Math.max(2, Math.min(h, H - y))];
  });
}
function sampleRoi(x, y, w, h) {   // mean RGB of skin pixels (darker hair/brow pixels dropped); also feeds the histogram
  const d = wctx.getImageData(x, y, w, h).data, n = d.length / 4; let s = 0;
  for (let i = 0; i < d.length; i += 4) s += 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
  const lim = 0.65 * s / n; let r = 0, g = 0, b = 0, c = 0;

    if (0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2] < lim) continue;
    r += d[i]; g += d[i + 1]; b += d[i + 2]; c++;

}
async function lockCamera(tr) {     // freeze auto exposure / white balance where the browser allows it
  try {
    const caps = tr.getCapabilities ? tr.getCapabilities() : {}, st = tr.getSettings ? tr.getSettings() : {}, adv = {};
    if (caps.exposureMode && caps.exposureMode.includes('manual')) {
      adv.exposureMode = 'manual'; if (st.exposureTime) adv.exposureTime = st.exposureTime; if (st.iso) adv.iso = st.iso;
    }
    if (caps.whiteBalanceMode && caps.whiteBalanceMode.includes('manual')) {
      adv.whiteBalanceMode = 'manual'; if (st.colorTemperature) adv.colorTemperature = st.colorTemperature;
    }
    if (Object.keys(adv).length) await tr.applyConstraints({ advanced: [adv] });
  } catch (e) {}
}
async function startCamera() {
  if (running) return;
  try {
    stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 1280 }, height: { ideal: 720 }, frameRate: { ideal: 30 } }, audio: false });
  } catch (e) { $('msg').textContent = 'camera blocked'; return; }
  video.srcObject = stream; await video.play();
  work.width = 480; work.height = Math.round(480 * video.videoHeight / video.videoWidth);
  track = stream.getVideoTracks()[0];
  const g = ++gen; setTimeout(() => { if (gen === g && track) lockCamera(track); }, 2500);
  loadDetector(); running = true; schedule(g);
}
// one sample per real camera frame, stamped with the frame's own capture time
function schedule(g) {
  if (!running || g !== gen) return;
  if (video.requestVideoFrameCallback) video.requestVideoFrameCallback((now, meta) => { schedule(g); if (g === gen) onFrame(now, meta); });
  else requestAnimationFrame(now => { schedule(g); if (g === gen) onFrame(now, {}); });
}

function setHidden(v) {      // hide the number (face gone, or an implausible rate)
  if (v === hrHidden) return; hrHidden = v; $('hr').classList.toggle('hide', v);
  if (v) { $('qbar').style.width = '0px'; beat.on = false; wasOk = false; curOk = false; }
}
function resetSignal() { engine.reset(); prevLum = null; beatsT = []; tlPulse = null; beat.on = false; wasOk = false; curOk = false; }

function onFrame(now, meta) {
  if (useCap === null) useCap = typeof meta.captureTime === 'number';
  const ts = (useCap ? meta.captureTime : now) / 1000;
  if (ts - lastTs < 0.028) return;
  lastTs = ts; frame++; clk = { ts, wall: performance.now() };
  const W = work.width, H = work.height;
  wctx.drawImage(video, 0, 0, W, H);
  updateBox(now, ts, W, H);
  if (noFaceSince !== null && ts - noFaceSince >= 3) setHidden(true);     // no face for 3 s: hide the heart rate
  if (!cur) {
    if (!lostReset) { resetSignal(); lostReset = true; $('hr').classList.add('low'); }
    drawPreview(null); return;
  }
  lostReset = false;
  bins.forEach(a => a.fill(0));
  const rois = faceRois(cur, W, H), ms = rois.map(r => sampleRoi(...r));
  const m = [0, 1, 2].map(i => (ms[0][i] + ms[1][i] + ms[2][i]) / 3);
  mv.push({ t: ts, x: cur.x + cur.w / 2, y: cur.y + cur.h / 2 }); while (mv[0].t < ts - 1) mv.shift();
  const d = Math.hypot(mv.at(-1).x - mv[0].x, mv.at(-1).y - mv[0].y) / cur.w;   // how far the face travelled in 1 s
  if (d > 0.12) flagUntil = ts + 1.5;
  if (d > 0.35) resetSignal();
  const lum = 0.299 * m[0] + 0.587 * m[1] + 0.114 * m[2];   // a heartbeat moves brightness ~1%; big jumps are artifacts
  if (prevLum !== null) { const j = Math.abs(lum - prevLum) / prevLum; if (j > 0.10) { resetSignal(); flagUntil = ts + 2; } else if (j > 0.04) flagUntil = ts + 2; }
  prevLum = lum; engine.add(ts, ...m);
  rawRows.push({ t: ts.toFixed(3), r: m[0].toFixed(2), g: m[1].toFixed(2), b: m[2].toFixed(2) });
  if (rawRows.length > 30000) rawRows.splice(0, 3000);
  drawPreview(rois);

  if (ts - lastUi >= 1) {                    // full estimate once a second
    lastUi = ts; lastPulse = ts;
    const res = engine.estimate(); if (res) handleEstimate(res, ts);
  } else if (curOk && ts - lastPulse >= 0.25) {   // beat timeline refreshes 4x a second
    lastPulse = ts; const pd = engine.pulseData();
    if (pd) { updateBeats(pd, curBpm, true); planFromBeats(curBpm); }
  }
}
function handleEstimate(res, ts) {
  const moving = ts < flagUntil, bpm = Math.round(res.bpm), plausible = bpm >= 50;   // 40s are hidden
  const ok = res.quality >= MIN_Q && !moving && plausible;
  setHidden(!plausible);
  $('hr').classList.toggle('low', !ok);
  $('bpm').textContent = bpm; $('pm').textContent = '±' + Math.max(2, Math.round(res.sigma));
  if (!hrHidden) { $('qbar').style.width = Math.round(res.quality * 320) + 'px'; $('qbar').style.background = ok ? '#ff4d5e' : '#333'; }
  if (ok && !wasOk) Snd.lock();
  wasOk = ok; curOk = ok; curBpm = res.bpm;
  updateBeats({ pulse: res.pulse, t0: res.t0, fs: 30 }, res.bpm, ok);
  if (ok) planFromBeats(res.bpm); else beat.on = false;
  rows.push({ time: new Date().toISOString(), bpm, raw_bpm: res.raw.toFixed(1), signal_pct: Math.round(res.quality * 100), plus_minus: res.sigma.toFixed(1), greyed: ok ? 0 : 1, hidden: hrHidden ? 1 : 0 });
}
function updateBeats(pd, bpm, ok) {
  tlPulse = pd;
  let mx = 0; for (const v of pd.pulse) mx = Math.max(mx, Math.abs(v));
  tlMx = tlMx === 1 ? (mx || 1) : tlMx * 0.6 + (mx || tlMx) * 0.4;
  if (!ok) return;                                   // never mark beats on a noisy signal
  const { found, lo, hi } = detectBeats(pd, bpm), tEnd = pd.t0 + (pd.pulse.length - 1) / pd.fs;
  beatsT = beatsT.filter(b => b.t < lo || b.t > hi).concat(found).sort((a, b) => a.t - b.t);
  while (beatsT.length && beatsT[0].t < tEnd - TL_WIN - 5) beatsT.shift();
}
function planFromBeats(bpm) {    // time the number pulse and sound to the next beat after the last detected one
  if (!beatsT.length || !clk) { beat.on = false; return; }
  const per = 60 / bpm, tr = renderT(performance.now()), last = beatsT[beatsT.length - 1].t;
  const k = Math.max(1, Math.ceil((tr + 0.15 - last) / per));
  beat.per = per * 1000; beat.at = performance.now() + (last + k * per - tr) * 1000; beat.on = true;
}

/* ---------- Drawing ---------- */
function drawPreview(rois) {
  const c = $('face'), x = c.getContext('2d'), CW = c.width, CH = c.height, vw = video.videoWidth, vh = video.videoHeight;
  x.save(); x.fillStyle = '#0a0a0a'; x.fillRect(0, 0, CW, CH); x.translate(CW, 0); x.scale(-1, 1);   // mirrored, like a mirror
  if (!rois) {
    const s = Math.max(CW / vw, CH / vh); x.globalAlpha = 0.28;
    x.drawImage(video, (vw - CW / s) / 2, (vh - CH / s) / 2, CW / s, CH / s, 0, 0, CW, CH); x.restore(); return;
  }
  const k = vw / work.width, cw = cur.w * 2.1, ch = cw * CH / CW, sx = cur.x + cur.w / 2 - cw / 2, sy = cur.y + cur.h * 0.42 - ch / 2;
  x.drawImage(video, sx * k, sy * k, cw * k, ch * k, 0, 0, CW, CH);
  x.strokeStyle = 'rgba(255,255,255,.4)'; x.lineWidth = 1.5;
  for (const [rx, ry, rw, rh] of rois) x.strokeRect((rx - sx) / cw * CW, (ry - sy) / ch * CH, rw / cw * CW, rh / ch * CH);
  x.restore();
}
function layoutFace() {   // the preview is exactly as tall as its row, 6:7
  const f = $('face'), hh = f.parentElement.clientHeight;
  if (hh > 0) { f.style.aspectRatio = 'auto'; f.style.height = hh + 'px'; f.style.width = Math.floor(hh * 6 / 7) + 'px'; }
}
addEventListener('resize', layoutFace);
const dpr = Math.min(2, window.devicePixelRatio || 1);
function fit(c) { const w = Math.round(c.clientWidth * dpr), h = Math.round(c.clientHeight * dpr); if (c.width !== w || c.height !== h) { c.width = w; c.height = h; } }
const CH_COL = [[255, 77, 94], [61, 255, 160], [77, 155, 255]];

// Timeline of detected heartbeats: the pulse trace scrolls right-to-left, each beat gets a marker and a tick, "now" is the right edge
function drawTimeline(nowMs) {
  const c = $('tl'); fit(c); const x = c.getContext('2d'), w = c.width, h = c.height; x.clearRect(0, 0, w, h);
  const xr = w - 36 * dpr, yw = h * 0.42, A = h * 0.26, lane = h * 0.86;
  const tr = clk ? renderT(nowMs) : 0, X = t => xr - (tr - t) / TL_WIN * xr;
  x.lineWidth = dpr; x.strokeStyle = 'rgba(255,255,255,.05)';
  if (clk) for (let t = Math.floor(tr / 5) * 5; t > tr - TL_WIN; t -= 5) { x.beginPath(); x.moveTo(X(t), 0); x.lineTo(X(t), h); x.stroke(); }
  x.strokeStyle = 'rgba(255,255,255,.12)'; x.beginPath(); x.moveTo(0, yw); x.lineTo(xr, yw); x.stroke();           // baseline
  x.beginPath(); x.moveTo(0, lane); x.lineTo(xr, lane); x.stroke();                                               // beat lane
  const flash = Math.max(0, 1 - (nowMs - flashAt) / 700);
  x.strokeStyle = `rgba(255,255,255,${(0.14 + 0.5 * flash).toFixed(3)})`; x.beginPath(); x.moveTo(xr, 0); x.lineTo(xr, h); x.stroke();   // now
  if (clk && tlPulse) {                                      // pulse trace
    const { pulse: p, t0, fs } = tlPulse, g = x.createLinearGradient(0, 0, xr, 0);
    const a = curOk ? 0.75 : 0.22;
    g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.3, `rgba(255,255,255,${(a * 0.5).toFixed(2)})`); g.addColorStop(1, `rgba(255,255,255,${a})`);
    x.strokeStyle = g; x.lineWidth = 1.6 * dpr; x.lineJoin = 'round'; x.beginPath(); let started = false;
    for (let i = Math.max(0, Math.floor((tr - TL_WIN - t0) * fs)); i < p.length; i++) {
      const px = X(t0 + i / fs), py = yw - Math.max(-1.3, Math.min(1.3, p[i] / tlMx)) * A;
      if (!started) { x.moveTo(px, py); started = true; } else x.lineTo(px, py);
    }
    x.stroke();
  }
  x.lineCap = 'round';
  for (let i = 0; i < beatsT.length; i++) {                  // detected beats
    const b = beatsT[i], bx = X(b.t); if (bx < 0 || bx > xr + 2) continue;
    const al = Math.max(0.15, Math.pow(1 - (tr - b.t) / TL_WIN, 0.8)), by = yw - Math.min(1, b.a) * A;
    x.strokeStyle = `rgba(255,77,94,${(al * 0.3).toFixed(3)})`; x.lineWidth = dpr; x.beginPath(); x.moveTo(bx, by); x.lineTo(bx, lane); x.stroke();
    x.strokeStyle = `rgba(255,77,94,${al.toFixed(3)})`; x.lineWidth = 2.6 * dpr; x.beginPath(); x.moveTo(bx, lane - 9 * dpr); x.lineTo(bx, lane + 9 * dpr); x.stroke();
    x.fillStyle = `rgba(255,77,94,${al.toFixed(3)})`; x.beginPath(); x.arc(bx, by, 3.4 * dpr, 0, 6.2832); x.fill();
    if (i > 0) {                                             // gap to the previous beat
      const px = X(beatsT[i - 1].t); x.strokeStyle = `rgba(255,255,255,${(al * 0.18).toFixed(3)})`; x.lineWidth = dpr;
      x.beginPath(); x.moveTo(px + 3 * dpr, lane); x.lineTo(bx - 3 * dpr, lane); x.stroke();
    }
  }
  if (flash > 0) {                                           // ring on the now-line at each beat
    x.strokeStyle = `rgba(255,77,94,${(flash * flash * 0.7).toFixed(3)})`; x.lineWidth = 1.6 * dpr;
    x.beginPath(); x.arc(xr, yw, (5 + 26 * (1 - flash)) * dpr, 0, 6.2832); x.stroke();
  }
}
let histMax = 1;
function drawHist() {
  const c = $('hist'); fit(c); const x = c.getContext('2d'), w = c.width, h = c.height; x.clearRect(0, 0, w, h);
  let mx = 1;
  for (let ci = 0; ci < 3; ci++) for (let b = 0; b < 64; b++) { sbins[ci][b] += (bins[ci][b] - sbins[ci][b]) * 0.22; mx = Math.max(mx, sbins[ci][b]); }
  histMax = histMax * 0.97 + mx * 0.03;
  x.globalCompositeOperation = 'lighter';
  for (let ci = 0; ci < 3; ci++) {
    const col = CH_COL[ci].join(',');
    x.beginPath(); x.moveTo(0, h);
    for (let b = 0; b < 64; b++) x.lineTo(b / 63 * w, h - 2 - Math.min(1, sbins[ci][b] / histMax) * (h - 10 * dpr));
    x.lineTo(w, h); x.closePath(); x.fillStyle = `rgba(${col},.32)`; x.fill();
    x.strokeStyle = `rgba(${col},.9)`; x.lineWidth = 1.4 * dpr; x.stroke();

}
function loop(nowMs) {
  requestAnimationFrame(loop);
  if (!$('app').classList.contains('on')) return;
  if (beat.on && nowMs >= beat.at) {
    flashAt = nowMs; Snd.beat();
    const el = $('bpm'); el.classList.remove('beat'); void el.offsetWidth; el.classList.add('beat');
    beat.at += beat.per; if (nowMs - beat.at > beat.per * 2) beat.at = nowMs + beat.per;
  }
  drawTimeline(nowMs); drawHist();
}

/* ---------- Keys: M mute, E readings CSV, R raw CSV ---------- */
function toCsv(list) { const cols = Object.keys(list[0] || {}); return cols.join(',') + '\n' + list.map(r => cols.map(c => r[c]).join(',')).join('\n'); }
function download(name, list) {
  if (!list.length) return;
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([toCsv(list)], { type: 'text/csv' }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
addEventListener('keydown', e => {
  if ($('pad').classList.contains('on')) {
    if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('⌫'); else if (e.key === 'Escape') closePad();
    return;
  }
  if (!$('app').classList.contains('on')) return;
  const k = e.key.toLowerCase();
  if (k === 'm') Snd.toggle(); else if (k === 'e') download('rppg-readings.csv', rows); else if (k === 'r') download('rppg-raw-rgb.csv', rawRows);
});

requestAnimationFrame(loop);
if (isUnlocked()) showApp();
})();
</script>
