<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<meta name="author" content="Rachit">
<title>rPPG heart rate</title>
<style>
  :root { --bg:#0b0d10; --card:#14181d; --fg:#f2f4f7; --mut:#8b95a1; --acc:#ff4d5e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui,sans-serif;
         padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom); max-width:560px; margin-inline:auto; }
  h1 { font-size:18px; margin:16px 0 12px; font-weight:600; }
  .seg { display:flex; background:var(--card); border-radius:12px; padding:4px; gap:4px; }
  .seg button { flex:1; border:0; background:none; color:var(--mut); padding:10px; border-radius:9px; font:inherit; }
  .seg button.on { background:#232a32; color:var(--fg); }
  .view { position:relative; margin-top:12px; background:#000; border-radius:16px; overflow:hidden; width:100%; aspect-ratio:4/3; }
  .view video, .view canvas { position:absolute; inset:0; width:100%; height:100%; }
  .mirror { transform:scaleX(-1); }
  .oval { position:absolute; left:25%; top:12%; width:50%; height:76%; border:2px dashed #ffffff55; border-radius:50%; pointer-events:none; }
  .readout { text-align:center; margin:16px 0 4px; }
  #bpm { font-size:80px; font-weight:700; line-height:1; color:var(--acc); }
  #status { color:var(--mut); min-height:44px; margin-top:6px; }
  #wave { width:100%; height:70px; background:var(--card); border-radius:12px; display:block; }
  #go { width:100%; margin-top:12px; padding:14px; border:0; border-radius:12px; background:var(--acc); color:#fff; font:600 16px system-ui; }
  small { display:block; color:var(--mut); margin:16px 0; text-align:center; }
  .chip { margin-top:10px; border:0; background:var(--card); color:var(--fg); padding:8px 14px; border-radius:999px; font:inherit; font-size:14px; }
  .card { background:var(--card); border-radius:14px; padding:12px; margin-top:12px; }
  .card .row { display:flex; justify-content:space-between; align-items:center; margin-bottom:8px; font-size:14px; }
  #rgb { width:100%; height:110px; display:block; }
  #sw i { display:inline-block; width:14px; height:14px; border-radius:4px; vertical-align:-2px; margin-right:6px; border:1px solid #888; }
  .legend { font-size:13px; font-weight:700; display:flex; gap:14px; margin-top:6px; }
  .card p { color:var(--mut); font-size:13px; margin:8px 0 0; }
  body.lit { --bg:#fff; --card:#eef0f3; --fg:#111; --mut:#555; }
  body.lit .view { box-shadow:0 0 0 22px #fff; margin:34px 0 0; }
  body.lit .seg button.on { background:#fff; color:#111; }
  footer { text-align:center; color:var(--mut); font-size:13px; padding:4px 0 24px; letter-spacing:.3px; }
</style>
</head>
<body>
<h1>Heart rate from your camera</h1>
<div class="seg">
  <button id="mFace" class="on">Face (rPPG)</button>
  <button id="mPpg">Contact (PPG)</button>
</div>
<div class="seg" id="sites" style="display:none;margin-top:8px">
  <button id="sFinger" class="on">Finger</button>
  <button id="sEar">Under ear</button>
  <button id="sWrist">Wrist</button>
</div>
<button id="light" class="chip">Screen light: on</button>
<div class="view" id="view">
  <video id="video" playsinline muted></video>
  <canvas id="overlay"></canvas>
  <div class="oval" id="oval"></div>
</div>
<div class="readout"><div id="bpm">--</div><div id="status">Tap Start. Everything runs on your device; no video is uploaded.</div></div>
<canvas id="wave" width="600" height="140"></canvas>
<div class="card">
  <div class="row"><b>What the camera sees</b><span id="sw"></span></div>
  <canvas id="rgb" width="600" height="220"></canvas>
