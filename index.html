<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="author" content="Rachit Ranade">
<title>rPPG</title>
<style>
  * { box-sizing:border-box; }
  html, body { height:100%; margin:0; background:#000; color:#fff; overflow:hidden;
    font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
  button { font:inherit; color:inherit; }

  /* landing */
  #landing { position:fixed; inset:0; background:#000; display:flex; align-items:center; justify-content:center;
    transition:opacity .7s ease, visibility .7s; z-index:10; }
  #landing.gone { opacity:0; visibility:hidden; pointer-events:none; }
  #sky { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; z-index:0; }
  #unlock { all:unset; position:relative; z-index:1; cursor:pointer; color:#000; font:200 clamp(56px,11vw,170px)/1 ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    letter-spacing:-.03em; transition:letter-spacing .6s cubic-bezier(.2,.8,.2,1), transform .2s, opacity .3s;
    animation:rise 1s cubic-bezier(.2,.8,.2,1) both; }
  #unlock:hover { letter-spacing:.03em; }
  #unlock:active { transform:scale(.97); opacity:.7; }

  /* keypad */
  #pad { position:fixed; inset:0; background:#000; z-index:20; display:flex; flex-direction:column; align-items:center;
    justify-content:center; gap:56px; opacity:0; visibility:hidden; transition:opacity .45s ease, visibility .45s; }
  #pad.on { opacity:1; visibility:visible; }
  #dots { display:flex; gap:22px; }
  .dot { width:14px; height:14px; border-radius:50%; border:1px solid #666; transition:background .2s, border-color .2s, box-shadow .3s; }
  .dot.f { background:#fff; border-color:#fff; box-shadow:0 0 18px #ffffff66; }
  #dots.bad .dot { background:#ff4d5e; border-color:#ff4d5e; box-shadow:0 0 18px #ff4d5e88; }
  #dots.bad { animation:shake .42s; }
  #dots.ok .dot { background:#fff; border-color:#fff; box-shadow:0 0 28px #fff; }
  #keys { display:grid; grid-template-columns:repeat(3,78px); gap:18px; }
  .k { width:78px; height:78px; border-radius:50%; border:1px solid #2a2a2a; background:none; cursor:pointer;
    font:200 30px ui-sans-serif,system-ui,sans-serif; transition:transform .12s, background .25s, border-color .25s; }
  .k:hover { background:#101010; border-color:#555; }
  .k:active { transform:scale(.91); background:#1c1c1c; }

  /* app */
  #app { position:fixed; inset:0; display:grid; grid-template-rows:minmax(0,1fr) auto 44px; opacity:0; visibility:hidden;
    transition:opacity .9s ease .1s, visibility .9s; }
  #app.on { opacity:1; visibility:visible; }
  main { display:grid; grid-template-columns:auto minmax(0,1fr); gap:32px; padding:36px 44px 8px; min-height:0; }
  .left { position:relative; min-height:0; height:100%; }
  #face { height:100%; aspect-ratio:6/7; border-radius:20px; background:#0a0a0a; display:block; }
  #msg { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; color:#555; font-size:13px; letter-spacing:.12em; }
  .right { min-height:0; }
  #tl { width:100%; height:100%; display:block; min-height:0; }
  #hr { position:relative; display:flex; align-items:baseline; justify-content:center; gap:16px; padding:6px 0 14px; }
  #bpm { font-size:clamp(72px,14vh,160px); font-weight:200; line-height:1; font-variant-numeric:tabular-nums;
    color:#fff; transition:color .6s ease, opacity .6s ease; }
  #bpm.beat { animation:beat .3s ease-out; }
  #hr.low #bpm { color:#363636; animation:none; }
  #pm { font-size:20px; font-weight:300; color:#666; min-width:48px; transition:color .6s, opacity .6s; }
  #hr.hide #bpm, #hr.hide #pm, #hr.hide #hrv { opacity:0; }
  #hrv { display:flex; align-items:baseline; gap:9px; margin-left:48px; transition:opacity .6s ease; }
  #hrv b { font-size:clamp(30px,5.2vh,58px); font-weight:200; line-height:1; font-variant-numeric:tabular-nums; min-width:2ch; text-align:right; transition:color .6s ease; }
  #hrv span { font-size:12px; letter-spacing:.16em; color:#666; }
  #hrv.low b, #hr.low #hrv b { color:#363636; }
  #hr.low #pm { color:#333; }
  #qbar { position:absolute; bottom:0; left:50%; height:1px; width:0; transform:translateX(-50%); background:#ff4d5e;
    transition:width .7s ease, background .7s ease; }
  #app.on main > * { animation:rise .9s cubic-bezier(.2,.8,.2,1) both; }
  #app.on main > .right { animation-delay:.12s; }
  #app.on #hr { animation:rise .9s cubic-bezier(.2,.8,.2,1) .25s both; }

  #by { position:fixed; left:0; right:0; bottom:0; height:44px; display:flex; align-items:center; justify-content:center;
    font-size:12px; letter-spacing:.16em; color:#555; z-index:15; transition:color .6s, opacity .4s; pointer-events:none; }
  #byt { pointer-events:auto; cursor:pointer; transition:color .3s; padding:8px 14px; }
  #byt:hover { color:#bbb; }
  body.padon #by { opacity:0; }
  video { position:fixed; right:0; bottom:0; width:2px; height:2px; opacity:.01; pointer-events:none; }
  .block { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; color:#777; letter-spacing:.14em; font-size:14px; }

  /* face flash (same red as the beat markers) + warnings */
  #flash { position:absolute; left:0; top:0; border-radius:20px; pointer-events:none; opacity:0;
    background:radial-gradient(ellipse 58% 52% at 50% 44%, rgba(255,70,90,.9) 0%, rgba(255,70,90,.48) 55%, rgba(255,70,90,0) 100%); }
  #warn { position:absolute; left:0; right:0; top:14px; display:flex; flex-direction:column; align-items:center; gap:8px; pointer-events:none; }
  .pill { display:flex; align-items:center; gap:9px; padding:7px 14px; border-radius:99px; background:rgba(0,0,0,.62); border:1px solid #ffb02e55;
    color:#ffd58a; font-size:12px; letter-spacing:.14em; animation:rise .4s ease both; }
  .pill::before { content:""; width:7px; height:7px; border-radius:50%; background:#ffb02e; animation:blink 1.2s ease-in-out infinite; }

  /* how-to animation */
  #guide { position:fixed; inset:0; z-index:12; background:#000; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:26px;
    opacity:0; visibility:hidden; transition:opacity .6s ease, visibility .6s; }
  #guide.on { opacity:1; visibility:visible; }
  #guide svg { width:min(760px,84vw); height:auto; overflow:visible; }
  .caps { position:relative; width:min(760px,84vw); height:42px; text-align:center; }
  .caps span { position:absolute; left:0; right:0; top:0; font-size:clamp(20px,3.2vh,30px); font-weight:200; opacity:0; }
  .caps span:nth-child(1) { animation:c1 15s infinite; } .caps span:nth-child(2) { animation:c2 15s infinite; } .caps span:nth-child(3) { animation:c3 15s infinite; }
  .steps { display:flex; gap:10px; margin-top:-8px; }
  .steps i { width:6px; height:6px; border-radius:50%; background:#333; }
  .steps i:nth-child(1) { animation:s1 15s infinite; } .steps i:nth-child(2) { animation:s2 15s infinite; } .steps i:nth-child(3) { animation:s3 15s infinite; }
  #start { margin-top:6px; padding:12px 34px; border-radius:99px; border:1px solid #444; background:none; cursor:pointer; font-size:14px; letter-spacing:.22em;
    transition:background .3s, color .3s, border-color .3s, transform .15s; animation:rise 1s ease 1.2s both; }
  #start:hover { background:#fff; color:#000; border-color:#fff; }
  #start:active { transform:scale(.96); }
  .person { animation:slide 15s infinite cubic-bezier(.2,.8,.2,1); }
  .rl { stroke-dasharray:1; stroke-dashoffset:1; animation:draw 15s infinite; }
  .ruler { animation:fadeAll 15s infinite; }
  .ruler text { animation:lab 15s infinite; }
  .beam, .lit { opacity:0; animation:lamp 15s infinite; }
  .bulb { animation:bulb 15s infinite; }
  .hb { opacity:0; animation:hbw 15s infinite; }
  .hb circle { animation:hbp .83s infinite ease-out; }
  @keyframes blink { 50% { opacity:.35; } }
  @keyframes slide { 0% { transform:translateX(210px); opacity:0; } 4% { opacity:1; } 30% { transform:translateX(0); } 96% { transform:translateX(0); opacity:1; } 100% { transform:translateX(0); opacity:0; } }
  @keyframes draw { 0% { stroke-dashoffset:1; } 14%, 100% { stroke-dashoffset:0; } }
  @keyframes fadeAll { 0% { opacity:0; } 6%, 94% { opacity:1; } 100% { opacity:0; } }
  @keyframes lab { 0%, 14% { opacity:0; } 22%, 94% { opacity:1; } 100% { opacity:0; } }
  @keyframes lamp { 0%, 32% { opacity:0; } 38%, 94% { opacity:1; } 100% { opacity:0; } }
  @keyframes bulb { 0%, 32% { fill:#1a1a1a; } 38%, 94% { fill:#ffe6a8; } 100% { fill:#1a1a1a; } }
  @keyframes hbw { 0%, 66% { opacity:0; } 68%, 95% { opacity:1; } 98%, 100% { opacity:0; } }
  @keyframes hbp { 0% { opacity:.6; } 100% { opacity:0; } }
  @keyframes c1 { 0% { opacity:0; transform:translateY(8px); } 4%, 29% { opacity:1; transform:none; } 33%, 100% { opacity:0; } }
  @keyframes c2 { 0%, 32% { opacity:0; transform:translateY(8px); } 37%, 62% { opacity:1; transform:none; } 66%, 100% { opacity:0; } }
  @keyframes c3 { 0%, 65% { opacity:0; transform:translateY(8px); } 70%, 95% { opacity:1; transform:none; } 99%, 100% { opacity:0; } }
  @keyframes s1 { 0%, 33% { background:#fff; } 34%, 100% { background:#333; } }
  @keyframes s2 { 0%, 33% { background:#333; } 34%, 66% { background:#fff; } 67%, 100% { background:#333; } }
  @keyframes s3 { 0%, 66% { background:#333; } 67%, 100% { background:#fff; } }
  @keyframes rise { from { opacity:0; transform:translateY(14px); } to { opacity:1; transform:none; } }
  @keyframes shake { 0%,100% { transform:none; } 20% { transform:translateX(-12px); } 40% { transform:translateX(10px); }
    60% { transform:translateX(-7px); } 80% { transform:translateX(4px); } }
  @keyframes beat { 0% { transform:scale(1); } 30% { transform:scale(1.035); } 100% { transform:scale(1); } }
</style>
</head>
<body>

<div id="pad"><div id="dots"><i class="dot"></i><i class="dot"></i><i class="dot"></i><i class="dot"></i></div><div id="keys"></div></div>
<div id="app">

</div>
<video id="video" playsinline muted></video>
<div id="guide">
  <svg viewBox="0 0 640 330" aria-hidden="true">
    <defs>
      <linearGradient id="beamg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#ffe6a8" stop-opacity=".55"/><stop offset="1" stop-color="#ffe6a8" stop-opacity=".06"/></linearGradient>
      <radialGradient id="faceg" cx=".12" cy=".5" r=".95"><stop offset="0" stop-color="#ffe6a8" stop-opacity=".7"/><stop offset="1" stop-color="#ffe6a8" stop-opacity="0"/></radialGradient>
    </defs>
    <line x1="16" y1="262" x2="624" y2="262" stroke="#2a2a2a" stroke-width="2"/>

  <div class="caps"><span>sit up to 40 cm from the camera</span><span>light your face from the front</span><span>stay still and keep the light steady</span></div>

  <button id="start">start</button>
</div>

<script>
(function () {
'use strict';
const $ = id => document.getElementById(id);
if (matchMedia('(pointer: coarse)').matches || innerWidth < 800) {
  document.body.innerHTML = '<div class="block">desktop only</div>'; return;
}

/* ---------- Signal engine ---------- */
const MIN_Q = 0.35;   // below this signal quality the heart rate is greyed out

function fft(re, im) {          // in-place radix-2 FFT
  const n = re.length;
  for (let i = 1, j = 0; i < n; i++) {
    let bit = n >> 1; for (; j & bit; bit >>= 1) j ^= bit; j ^= bit;
    if (i < j) { let t = re[i]; re[i] = re[j]; re[j] = t; t = im[i]; im[i] = im[j]; im[j] = t; }
  }
  for (let len = 2; len <= n; len <<= 1) {
    const ang = -2 * Math.PI / len, wr = Math.cos(ang), wi = Math.sin(ang), half = len >> 1;
    for (let i = 0; i < n; i += len) {
      let cr = 1, ci = 0;
      for (let k = 0; k < half; k++) {
        const a = i + k, b = a + half, tr = re[b] * cr - im[b] * ci, ti = re[b] * ci + im[b] * cr;
        re[b] = re[a] - tr; im[b] = im[a] - ti; re[a] += tr; im[a] += ti;
        const nr = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = nr;
      }
    }
  }
}
// Zero-phase band-pass (two Butterworth-style biquads, run forward and backward)
function biquad(type, f0, fs) {
  const w = 2 * Math.PI * f0 / fs, c = Math.cos(w), al = Math.sin(w) / (2 * Math.SQRT1_2);
  const b0 = type === 'lp' ? (1 - c) / 2 : (1 + c) / 2, b1 = type === 'lp' ? 1 - c : -(1 + c), a0 = 1 + al;
  return [b0 / a0, b1 / a0, b0 / a0, -2 * c / a0, (1 - al) / a0];
}
function runBiquad(k, x) {
  const [b0, b1, b2, a1, a2] = k, y = new Float64Array(x.length); let x1 = 0, x2 = 0, y1 = 0, y2 = 0;
  for (let i = 0; i < x.length; i++) {
    const v = b0 * x[i] + b1 * x1 + b2 * x2 - a1 * y1 - a2 * y2;
    y[i] = v; x2 = x1; x1 = x[i]; y2 = y1; y1 = v;
  }
  return y;
}
function filtfilt(k, x, fs) {
  const n = x.length, P = Math.min(n - 1, Math.round(3 * fs)), z = new Float64Array(n + 2 * P);
  for (let i = 0; i < P; i++) { z[i] = 2 * x[0] - x[P - i]; z[n + P + i] = 2 * x[n - 1] - x[n - 2 - i]; }
  z.set(x, P);
  let y = runBiquad(k, z); y.reverse(); y = runBiquad(k, y); y.reverse();
  return y.slice(P, P + n);
}
function bandpass(x, fs, lo = 0.6, hi = 3.3) {
  let m = 0; for (const v of x) m += v; m /= x.length;
  const y = filtfilt(biquad('hp', lo, fs), Float64Array.from(x, v => v - m), fs);
  return filtfilt(biquad('lp', hi, fs), y, fs);
}

class Engine {
  constructor(win = 20, min = 10) { this.win = win; this.min = min; this.fs = 30; this.reset(); }
  reset() { this.t = []; this.c = [0, 1, 2].map(() => [[], [], []]); this.sm = 0; }   // c[roi][channel]
  add(ts, v) {                       // v = [[r,g,b] forehead, [r,g,b] left cheek, [r,g,b] right cheek]
    this.t.push(ts); for (let k = 0; k < 3; k++) for (let ch = 0; ch < 3; ch++) this.c[k][ch].push(v[k][ch]);
    while (this.t.length > 1 && ts - this.t[0] > this.win) {
      this.t.shift(); for (let k = 0; k < 3; k++) for (let ch = 0; ch < 3; ch++) this.c[k][ch].shift();
    }
  }
  resample(v, n, fs) {
    const out = new Float64Array(n), t0 = this.t[0], T = this.t; let j = 0;
    for (let i = 0; i < n; i++) {
      const tt = t0 + i / fs;
      while (j < T.length - 2 && T[j + 1] < tt) j++;
      const f = Math.min(1, Math.max(0, (tt - T[j]) / (T[j + 1] - T[j])));
      out[i] = v[j] + f * (v[j + 1] - v[j]);
    }
    return out;
  }
  std(a) { let m = 0; for (const v of a) m += v; m /= a.length; let s = 0; for (const v of a) s += (v - m) * (v - m); return Math.sqrt(s / a.length); }
  pos(R, G, B, fs) {            // Wang et al. 2017, Plane-Orthogonal-to-Skin (window statistics from prefix sums)
    const n = R.length, L = Math.floor(1.6 * fs), h = new Float64Array(n);
    if (n < L + 1) return h;
    const S = () => new Float64Array(n + 1), pr = S(), pg = S(), pb = S(), prr = S(), pgg = S(), pbb = S(), prg = S(), prb = S(), pgb = S();
    for (let i = 0; i < n; i++) {
      pr[i + 1] = pr[i] + R[i]; pg[i + 1] = pg[i] + G[i]; pb[i + 1] = pb[i] + B[i];
      prr[i + 1] = prr[i] + R[i] * R[i]; pgg[i + 1] = pgg[i] + G[i] * G[i]; pbb[i + 1] = pbb[i] + B[i] * B[i];
      prg[i + 1] = prg[i] + R[i] * G[i]; prb[i + 1] = prb[i] + R[i] * B[i]; pgb[i + 1] = pgb[i] + G[i] * B[i];
    }
    for (let s = 0; s + L <= n; s++) {
      const e = s + L, mr = (pr[e] - pr[s]) / L, mg = (pg[e] - pg[s]) / L, mb = (pb[e] - pb[s]) / L;
      const Vr = ((prr[e] - prr[s]) / L - mr * mr) / (mr * mr), Vg = ((pgg[e] - pgg[s]) / L - mg * mg) / (mg * mg), Vb = ((pbb[e] - pbb[s]) / L - mb * mb) / (mb * mb);
      const Crg = ((prg[e] - prg[s]) / L - mr * mg) / (mr * mg), Crb = ((prb[e] - prb[s]) / L - mr * mb) / (mr * mb), Cgb = ((pgb[e] - pgb[s]) / L - mg * mb) / (mg * mb);
      const v1 = Vg + Vb - 2 * Cgb, v2 = Vg + Vb + 4 * Vr + 2 * Cgb - 4 * Crg - 4 * Crb;     // variances of (g-b) and (g+b-2r), normalised
      const al = Math.sqrt(Math.max(v1, 0)) / (Math.sqrt(Math.max(v2, 0)) + 1e-9);
      const cG = (1 + al) / mg, cB = (al - 1) / mb, cR = -2 * al / mr;                     // s1 + al*s2 as one linear combination (zero mean)
      for (let i = s; i < e; i++) h[i] += cR * R[i] + cG * G[i] + cB * B[i];
    }
    return h;
  }
  spectrum(pulse, fs, prior) {      // zero-padded FFT; prior = previous BPM (0 for none)
    const n = pulse.length, N = fs > 45 ? 8192 : 4096, re = new Float64Array(N), im = new Float64Array(N);
    for (let i = 0; i < n; i++) re[i] = pulse[i] * (0.5 - 0.5 * Math.cos(2 * Math.PI * i / (n - 1)));
    fft(re, im);
    const df = fs / N, kLo = Math.ceil(0.7 / df), kHi = Math.floor(3.0 / df), pw = k => re[k] * re[k] + im[k] * im[k];
    const P = new Float64Array(kHi + 2); let pk = kLo, tot = 0;
    for (let k = kLo; k <= kHi; k++) { P[k] = pw(k); tot += P[k]; if (P[k] > P[pk]) pk = k; }
    if (pk * df / 2 >= 0.9) {       // a peak at half the frequency that is nearly as strong means the main peak is a harmonic
      const kh = Math.round(pk * df / 2 / df), w = Math.round(0.05 / df); let best = kh;
      for (let k = Math.max(kLo, kh - w); k <= Math.min(kHi, kh + w); k++) if (P[k] > P[best]) best = k;
      if (P[best] > 0.6 * P[pk]) pk = best;
    }
    if (prior > 0) {                // stay near the previous estimate unless something else clearly dominates
      const kp = Math.round(prior / 60 / df), w = Math.round(12 / 60 / df); let best = -1;
      for (let k = Math.max(kLo, kp - w); k <= Math.min(kHi, kp + w); k++) if (best < 0 || P[k] > P[best]) best = k;
      if (best >= 0 && P[best] >= 0.5 * P[pk]) pk = best;
    }
    let f = pk * df;
    const a = pw(pk - 1), b = pw(pk), c = pw(pk + 1), d = a - 2 * b + c;     // parabolic refinement

function setHidden(v) {      // hide the number (face gone, or an implausible rate)

}
function resetSignal() { engine.reset(); prevLum = null; tlPulse = null; beat.on = false; wasOk = false; curOk = false; streak = 0; }   // old beats are kept: HRV simply sees a gap

function onFrame(now, meta) {

    dts.push(ts - prevRawTs);

  }
  prevRawTs = ts;
  if (ts - lastTs < 0.012) return;

  const W = work.width, H = work.height;
  wctx.drawImage(video, 0, 0, W, H);
  updateBox(now, ts, W, H);
  if (noFaceSince !== null && ts - noFaceSince >= 3) setHidden(true);     // no face for 3 s: hide the heart rate
  if (!cur) {
    if (!lostReset) { resetSignal(); lostReset = true; $('hr').classList.add('low'); }
    setWarns([]); drawPreview(null); return;
  }
  lostReset = false;
  const rois = faceRois(cur, W, H), ms = rois.map(r => sampleRoi(...r));
  const m = [0, 1, 2].map(i => (ms[0][i] + ms[1][i] + ms[2][i]) / 3);
  mv.push({ t: ts, x: cur.x + cur.w / 2, y: cur.y + cur.h / 2 }); while (mv[0].t < ts - 1) mv.shift();
  const d = Math.hypot(mv.at(-1).x - mv[0].x, mv.at(-1).y - mv[0].y) / cur.w;   // how far the face travelled in 1 s
  if (d > 0.12) { flagUntil = ts + 1.5; moveUntil = ts + 1.5; }

  prevLum = lum; engine.add(ts, ms);

function handleEstimate(res, ts) {

  const ok = streak >= 2 && cover >= 0.5 && !moving && plausible;

  $('bpm').textContent = bpm; $('pm').textContent = '±' + Math.max(2, Math.round(res.sigma));
  if (!hrHidden) { $('qbar').style.width = Math.round(res.quality * 320) + 'px'; $('qbar').style.background = ok ? '#ff4d5e' : '#333'; }

/* ---------- Drawing ---------- */
function drawPreview(rois) {
  const c = $('face'), x = c.getContext('2d'), CW = c.width, CH = c.height, vw = video.videoWidth, vh = video.videoHeight;
  x.save(); x.fillStyle = '#0a0a0a'; x.fillRect(0, 0, CW, CH); x.translate(CW, 0); x.scale(-1, 1);   // mirrored, like a mirror

  }
  const k = vw / work.width, cw = cur.w * 2.1, ch = cw * CH / CW, sx = cur.x + cur.w / 2 - cw / 2, sy = cur.y + cur.h * 0.42 - ch / 2;
  x.drawImage(video, sx * k, sy * k, cw * k, ch * k, 0, 0, CW, CH);

    const fl = $('flash'); fl.style.width = f.style.width; fl.style.height = f.style.height;

addEventListener('resize', layoutFace);
const dpr = Math.min(2, window.devicePixelRatio || 1);

// Timeline of detected heartbeats: the pulse trace scrolls right-to-left, each beat gets a marker and a tick, "now" is the right edge
function drawTimeline(nowMs) {
  const c = $('tl'); fit(c); const x = c.getContext('2d'), w = c.width, h = c.height; x.clearRect(0, 0, w, h);
  const xr = w - 36 * dpr, yw = h * 0.42, A = h * 0.26, lane = h * 0.86;

  x.strokeStyle = 'rgba(255,255,255,.12)'; x.beginPath(); x.moveTo(0, yw); x.lineTo(xr, yw); x.stroke();           // baseline
  x.beginPath(); x.moveTo(0, lane); x.lineTo(xr, lane); x.stroke();                                               // beat lane

  if (clk && tlPulse) {                                      // pulse trace

    g.addColorStop(0, 'rgba(255,255,255,0)'); g.addColorStop(0.3, `rgba(255,255,255,${(a * 0.5).toFixed(2)})`); g.addColorStop(1, `rgba(255,255,255,${a})`);

function flashLevel(nowMs) { const f = Math.max(0, 1 - (nowMs - flashAt) / 600); return f * f; }     // 1 at the beat, fades to 0
function flashFace(nowMs) { $('flash').style.opacity = cur && curOk ? (0.55 * flashLevel(nowMs)).toFixed(3) : '0'; }   // face flashes red on each beat, like the red plot marks

function updateWarns(ts) {

function setWarns(w) {

function loop(nowMs) {

/* ---------- Keys: M mute, E readings CSV, R raw CSV, I beat intervals CSV ---------- */
function toCsv(list) { const cols = Object.keys(list[0] || {}); return cols.join(',') + '\n' + list.map(r => cols.map(c => r[c]).join(',')).join('\n'); }
function download(name, list) {
  if (!list.length) return;
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([toCsv(list)], { type: 'text/csv' }));
  a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 1000);

addEventListener('keydown', e => {
  if ($('guide').classList.contains('on')) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); beginMeasuring(); } return; }
  if ($('pad').classList.contains('on')) {
    if (/^\d$/.test(e.key)) press(e.key); else if (e.key === 'Backspace') press('⌫'); else if (e.key === 'Escape') closePad();
    return;
  }

});

requestAnimationFrame(loop);
if (isUnlocked()) showApp(); else skyStart();
})();
