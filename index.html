<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0d10">
<title>rPPG heart rate</title>
<style>
  :root { --bg:#0b0d10; --card:#14181d; --fg:#f2f4f7; --mut:#8b95a1; --acc:#ff4d5e; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); font:16px/1.4 system-ui,sans-serif;
         padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom); max-width:560px; margin-inline:auto; }
  h1 { font-size:18px; margin:16px 0 12px; font-weight:600; }
  .seg { display:flex; background:var(--card); border-radius:12px; padding:4px; gap:4px; }
  .seg button { flex:1; border:0; background:none; color:var(--mut); padding:10px; border-radius:9px; font:inherit; }
  .seg button.on { background:#232a32; color:var(--fg); }
  .view { position:relative; margin-top:12px; background:#000; border-radius:16px; overflow:hidden; width:100%; aspect-ratio:4/3; }
  .view video, .view canvas { position:absolute; inset:0; width:100%; height:100%; }
  .mirror { transform:scaleX(-1); }
  .oval { position:absolute; left:25%; top:12%; width:50%; height:76%; border:2px dashed #ffffff55; border-radius:50%; pointer-events:none; }
  .readout { text-align:center; margin:16px 0 4px; }
  #bpm { font-size:80px; font-weight:700; line-height:1; color:var(--acc); }
  #status { color:var(--mut); min-height:44px; margin-top:6px; }
  #wave { width:100%; height:70px; background:var(--card); border-radius:12px; display:block; }
  #go { width:100%; margin-top:12px; padding:14px; border:0; border-radius:12px; background:var(--acc); color:#fff; font:600 16px system-ui; }
  small { display:block; color:var(--mut); margin:16px 0; text-align:center; }
</style>
</head>
<body>
<h1>Heart rate from your camera</h1>
<div class="seg">
  <button id="mFace" class="on">Face (rPPG)</button>
  <button id="mFinger">Finger (PPG)</button>
</div>
<div class="view" id="view">
  <video id="video" playsinline muted></video>
  <canvas id="overlay"></canvas>
  <div class="oval" id="oval"></div>
</div>
<div class="readout"><div id="bpm">--</div><div id="status">Tap Start. Everything runs on your device; no video is uploaded.</div></div>
<canvas id="wave" width="600" height="140"></canvas>
<button id="go">Start</button>
<small>Not a medical device. Keep still and well lit. Finger mode: cover the rear camera and flash with a fingertip.</small>

<script>
/* ---------- Signal engine ---------- */
class Engine {
  constructor(win = 10, min = 6) { this.win = win; this.min = min; this.reset(); }
  reset() { this.t = []; this.r = []; this.g = []; this.b = []; this.sm = 0; }
  add(ts, r, g, b) {
    this.t.push(ts); this.r.push(r); this.g.push(g); this.b.push(b);
    while (this.t.length > 1 && ts - this.t[0] > this.win) {
      this.t.shift(); this.r.shift(); this.g.shift(); this.b.shift();
    }
  }
  progress() { return this.t.length < 2 ? 0 : Math.min(1, (this.t.at(-1) - this.t[0]) / this.min); }
  resample(v, n, fs) {
    const out = new Float64Array(n), t0 = this.t[0], T = this.t; let j = 0;
    for (let i = 0; i < n; i++) {
      const tt = t0 + i / fs;
      while (j < T.length - 2 && T[j + 1] < tt) j++;
      const f = Math.min(1, Math.max(0, (tt - T[j]) / (T[j + 1] - T[j])));
      out[i] = v[j] + f * (v[j + 1] - v[j]);
    }
    return out;
  }
  highpass(x, fs) {
    const k = Math.floor(fs / 2), n = x.length, out = new Float64Array(n);
    for (let i = 0; i < n; i++) {
      const a = Math.max(0, i - k), e = Math.min(n - 1, i + k); let s = 0;
      for (let j = a; j <= e; j++) s += x[j];
      out[i] = x[i] - s / (e - a + 1);
    }
    return out;
  }
  std(a) { const m = a.reduce((x, y) => x + y, 0) / a.length; return Math.sqrt(a.reduce((s, v) => s + (v - m) ** 2, 0) / a.length); }
  pos(R, G, B, fs) {            // Wang et al. 2017, Plane-Orthogonal-to-Skin
    const n = R.length, L = Math.floor(1.6 * fs), h = new Float64Array(n);
    for (let s = 0; s <= n - L; s++) {
      let mr = 0, mg = 0, mb = 0;
      for (let i = s; i < s + L; i++) { mr += R[i]; mg += G[i]; mb += B[i]; }
      mr /= L; mg /= L; mb /= L;
      const s1 = new Float64Array(L), s2 = new Float64Array(L);
      for (let i = 0; i < L; i++) {
        const rn = R[s + i] / mr, gn = G[s + i] / mg, bn = B[s + i] / mb;
        s1[i] = gn - bn; s2[i] = gn + bn - 2 * rn;
      }
      const al = this.std(s1) / (this.std(s2) + 1e-9);
      const seg = s1.map((v, i) => v + al * s2[i]);
      const m = seg.reduce((x, y) => x + y, 0) / L;
      for (let i = 0; i < L; i++) h[s + i] += seg[i] - m;
    }
    return h;
  }
  estimate(ppg) {
    if (this.t.length < 2 || this.t.at(-1) - this.t[0] < this.min) return null;
    const fs = 30, n = Math.floor((this.t.at(-1) - this.t[0]) * fs);
    const pulse = ppg ? this.highpass(this.resample(this.r, n, fs), fs)
      : this.pos(this.resample(this.r, n, fs), this.resample(this.g, n, fs), this.resample(this.b, n, fs), fs);
    const w = pulse.map((v, i) => v * (0.5 - 0.5 * Math.cos(2 * Math.PI * i / (n - 1))));
    const freqs = []; for (let f = 0.7; f <= 3.0001; f += 0.01) freqs.push(f);
    const power = freqs.map(f => {
      let re = 0, im = 0; const om = 2 * Math.PI * f / fs;
      for (let i = 0; i < n; i++) { re += w[i] * Math.cos(om * i); im += w[i] * Math.sin(om * i); }
      return re * re + im * im;
    });
    let pk = 0; power.forEach((p, k) => { if (p > power[pk]) pk = k; });
    let sig = 0, tot = 0;
    power.forEach((p, k) => { tot += p; if (Math.abs(freqs[k] - freqs[pk]) <= 0.1) sig += p; });
    const quality = tot > 0 ? sig / tot : 0, bpm = freqs[pk] * 60;
    if (quality > 0.25) this.sm = this.sm === 0 ? bpm : 0.8 * this.sm + 0.2 * bpm;
    return { bpm: this.sm > 0 ? this.sm : bpm, quality, pulse };
  }
}

/* ---------- App ---------- */
const $ = id => document.getElementById(id);
const video = $('video'), overlay = $('overlay'), octx = overlay.getContext('2d');
const work = document.createElement('canvas'), wctx = work.getContext('2d', { willReadFrequently: true });
const engine = new Engine();
let mode = 'face', stream = null, running = false, detector = null, box = null, frame = 0, lastSample = 0, lastUi = 0, loadingDet = null;

function setMode(m) {
  mode = m; $('mFace').classList.toggle('on', m === 'face'); $('mFinger').classList.toggle('on', m === 'finger');
  $('oval').style.display = m === 'face' ? '' : 'none';
  $('bpm').textContent = '--'; engine.reset();
  $('status').textContent = m === 'finger' ? 'Cover the rear camera AND flash with a fingertip, light pressure.' : 'Fit your face in the oval, stay still.';
  if (running) start();
}
$('mFace').onclick = () => setMode('face');
$('mFinger').onclick = () => setMode('finger');
$('go').onclick = () => running ? stop() : start();

async function loadDetector() {
  if (detector || loadingDet) return loadingDet;
  loadingDet = (async () => {
    try {
      const v = '0.10.14', base = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${v}`;
      const m = await import(`${base}/vision_bundle.mjs`);
      const fs = await m.FilesetResolver.forVisionTasks(`${base}/wasm`);
      detector = await m.FaceDetector.createFromOptions(fs, {
        baseOptions: { modelAssetPath: 'https://storage.googleapis.com/mediapipe-models/face_detector/blaze_face_short_range/float16/1/blaze_face_short_range.tflite' },
        runningMode: 'VIDEO'
      });
    } catch (e) { detector = null; console.warn('Face detector unavailable, using fixed oval', e); }
  })();
  return loadingDet;
}

async function start() {
  stop(true);
  const ppg = mode === 'finger';
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      video: { facingMode: ppg ? 'environment' : 'user', width: { ideal: 640 }, height: { ideal: 480 }, frameRate: { ideal: 30 } }, audio: false });
  } catch (e) { $('status').textContent = 'Camera unavailable: ' + e.message; return; }
  video.srcObject = stream; await video.play();
  video.classList.toggle('mirror', !ppg); overlay.classList.toggle('mirror', !ppg);
  const vw = video.videoWidth, vh = video.videoHeight;
  $('view').style.aspectRatio = `${vw} / ${vh}`;
  work.width = 320; work.height = Math.round(320 * vh / vw); overlay.width = work.width; overlay.height = work.height;
  if (ppg) {
    const tr = stream.getVideoTracks()[0], caps = tr.getCapabilities ? tr.getCapabilities() : {};
    if (caps.torch) tr.applyConstraints({ advanced: [{ torch: true }] }).catch(() => {});
    else $('status').textContent = 'No flash control on this browser; use bright light behind your finger.';
  } else loadDetector();
  engine.reset(); box = null; running = true; $('go').textContent = 'Stop';
  requestAnimationFrame(loop);
}
function stop(keepRunning) {
  if (stream) stream.getTracks().forEach(t => t.stop());
  stream = null; if (!keepRunning) { running = false; $('go').textContent = 'Start'; octx.clearRect(0, 0, overlay.width, overlay.height); }
}

function meanRgb(x, y, w, h) {
  const d = wctx.getImageData(x, y, w, h).data; let r = 0, g = 0, b = 0; const n = d.length / 4;
  for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; b += d[i + 2]; }
  return [r / n, g / n, b / n];
}

function loop(now) {
  if (!running) return;
  requestAnimationFrame(loop);
  if (now - lastSample < 1000 / 30 || video.readyState < 2) return;
  lastSample = now; frame++;
  const W = work.width, H = work.height, ts = now / 1000, ppg = mode === 'finger';
  wctx.drawImage(video, 0, 0, W, H);
  octx.clearRect(0, 0, W, H);
  let roi;
  if (ppg) {
    roi = [W / 4, H / 4, W / 2, H / 2].map(Math.floor);
    const m = meanRgb(...roi);
    if (!(m[0] > 120 && m[0] > 1.8 * m[1] && m[0] > 1.8 * m[2])) {
      engine.reset(); $('bpm').textContent = '--'; $('status').textContent = 'Place fingertip over the camera and flash'; return;
    }
    engine.add(ts, ...m);
  } else {
    if (frame % 3 === 1) {
      box = { x: W * 0.25, y: H * 0.12, w: W * 0.5, h: H * 0.76 };            // fallback: the oval
      if (detector) {
        try {
          const dets = detector.detectForVideo(video, performance.now()).detections;
          if (!dets.length) { engine.reset(); box = null; }
          else {
            const bb = dets.map(d => d.boundingBox).sort((a, b) => b.width * b.height - a.width * a.height)[0], s = W / video.videoWidth;
            box = { x: bb.originX * s, y: bb.originY * s, w: bb.width * s, h: bb.height * s };
          }
        } catch (e) { /* keep fallback */ }
      }
    }
    if (!box) { $('bpm').textContent = '--'; $('status').textContent = 'No face found'; return; }
    roi = [box.x + box.w * 0.3, box.y + box.h * 0.05, box.w * 0.4, box.h * 0.2].map(Math.floor);
    roi[0] = Math.max(0, roi[0]); roi[1] = Math.max(0, roi[1]);
    roi[2] = Math.max(2, Math.min(roi[2], W - roi[0])); roi[3] = Math.max(2, Math.min(roi[3], H - roi[1]));
    engine.add(ts, ...meanRgb(...roi));
    octx.strokeStyle = '#4dff9a'; octx.lineWidth = 2; octx.strokeRect(...roi);
  }
  if (now - lastUi > 1000) {
    lastUi = now;
    const res = engine.estimate(ppg);
    if (!res) { $('bpm').textContent = '--'; $('status').textContent = `Measuring… ${Math.round(engine.progress() * 100)}%`; }
    else {
      $('bpm').textContent = Math.round(res.bpm);
      $('status').textContent = res.quality > 0.25 ? `BPM (signal ${Math.round(res.quality * 100)}%)`
        : ppg ? 'Weak signal: hold finger still, lighter pressure' : 'Weak signal: hold still, add light';
      drawWave(res.pulse);
    }
  }
}

function drawWave(p) {
  const c = $('wave'), x = c.getContext('2d'), n = Math.min(p.length, 300), a = p.slice(p.length - n);
  const mx = Math.max(...a.map(Math.abs)) || 1;
  x.clearRect(0, 0, c.width, c.height); x.strokeStyle = '#ff4d5e'; x.lineWidth = 3; x.beginPath();
  a.forEach((v, i) => { const px = i / (n - 1) * c.width, py = c.height / 2 - v / mx * (c.height / 2 - 8); i ? x.lineTo(px, py) : x.moveTo(px, py); });
  x.stroke();
}
setMode('face');
</script>
</body>
</html>
